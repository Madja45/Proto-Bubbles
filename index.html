<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quality in Action Day — Connecting the Dots</title>
<style>
  :root{
    --teal-deep:#06403C;--teal-bg:#0A5A54;
    --navy:#1B4A6E;--royal:#2E6DB4;--cyan:#4EB8E0;--sky:#A8D0F0;
    --green:#8DBF5E;--green-d:#5B9B34;--green-dk:#3C7D1E;--lime:#A9CE3B;--white:#fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;user-select:none;
    font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;color:#fff;
    background:radial-gradient(ellipse at 60% 42%, #0e7b6f 0%, var(--teal-bg) 44%, var(--teal-deep) 100%);}
  #app{position:relative;width:100vw;height:100vh;max-width:480px;margin:0 auto;overflow:hidden;}
  #dotsCanvas{position:absolute;inset:0;z-index:1;}
  #bubbles{position:absolute;inset:0;z-index:5;}

  header{position:absolute;top:0;left:0;right:0;z-index:10;padding:14px 18px 8px;
    display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(to bottom, rgba(6,64,60,0.9), rgba(6,64,60,0));}
  .logo-wrap{background:rgba(255,255,255,0.92);border-radius:10px;padding:5px 9px;display:flex;box-shadow:0 3px 12px rgba(0,0,0,0.25);}
  .logo{height:26px;width:auto;display:block;}
  .right{display:flex;align-items:center;gap:8px;}
  .ver-toggle{display:flex;background:rgba(255,255,255,0.12);border:1px solid rgba(169,206,59,0.4);border-radius:20px;overflow:hidden;font-size:10px;font-weight:800;}
  .ver-toggle button{border:none;background:transparent;color:rgba(255,255,255,0.65);padding:5px 9px;cursor:pointer;}
  .ver-toggle button.active{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;}
  .progress-pill{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,0.12);
    border:1px solid rgba(169,206,59,0.4);padding:6px 11px;border-radius:20px;font-size:11.5px;font-weight:800;white-space:nowrap;}
  .progress-pill .hi{color:var(--lime);}

  .title-zone{position:absolute;top:56px;left:0;right:0;z-index:8;text-align:center;pointer-events:none;}
  .title-zone h1{font-size:20px;font-weight:800;}
  .title-zone p{font-size:11px;opacity:.78;margin-top:2px;}

  #finalWord{position:absolute;top:102px;left:0;right:0;z-index:8;display:flex;justify-content:center;gap:3px;padding:0 6px;pointer-events:none;}
  .fw-slot{flex:1 1 0;max-width:26px;min-width:0;aspect-ratio:3/4;border-radius:6px;background:rgba(255,255,255,0.08);
    border:1.4px dashed rgba(169,206,59,0.4);display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:800;color:transparent;transition:all .5s cubic-bezier(.2,.9,.3,1.4);}
  .fw-slot.filled{color:#fff;border-style:solid;border-color:var(--lime);
    background:linear-gradient(135deg,var(--green),var(--green-d));box-shadow:0 3px 12px rgba(91,155,52,0.5);}
  .fw-slot.pop{animation:slotPop .6s cubic-bezier(.2,.9,.3,1.4);}
  @keyframes slotPop{0%{transform:scale(.3) rotate(-15deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}

  .bubble{position:absolute;cursor:pointer;border-radius:50%;will-change:transform;}
  .bubble .face{width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,0.3);}
  .bubble .face::before{content:"";position:absolute;top:11%;left:16%;width:34%;height:26%;
    background:radial-gradient(ellipse, rgba(255,255,255,0.8), transparent 70%);border-radius:50%;filter:blur(1px);}
  .bubble .clue{font-size:9.5px;font-weight:700;line-height:1.14;padding:0 12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);}
  .bubble .word{display:none;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);letter-spacing:.2px;}
  .bubble .word b{font-size:14px;font-weight:800;text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(255,255,255,0.75);}
  .bubble.found .clue{display:none;}
  .bubble.found .word{display:block;}
  /* BEFORE variants — brand bubble gradients */
  .v-sky .face{background:radial-gradient(circle at 34% 28%,#d6ecfa,#80C0E0 52%,#4080C0);}
  .v-royal .face{background:radial-gradient(circle at 34% 28%,#8fb8e8,#0060C0 55%,#002080);}
  .v-navy .face{background:radial-gradient(circle at 35% 30%,#3f6fae,#0040A0 60%,#002060);}
  .v-cyan .face{background:radial-gradient(circle at 32% 26%,#dffaf7,#A0E0E0 50%,#40A0C0);color:#08343f;}
  .v-teal .face{background:radial-gradient(circle at 34% 28%,#8fe0d6,#16a89b 55%,#0c6b62);}
  .v-lightblue .face{background:radial-gradient(circle at 34% 28%,#eaf4ff,#A0C0E0 55%,#6f9bd0);color:#123;}
  .v-cyan.found .word b,.v-lightblue.found .word b{color:#0a2e12;text-decoration-color:rgba(10,46,18,0.5);}
  /* AFTER — distinct green */
  .bubble.found .face{background:radial-gradient(circle at 35% 30%,#a7d97a,var(--green-d) 55%,var(--green-dk)) !important;color:#fff !important;
    box-shadow:0 8px 30px rgba(91,155,52,0.55),inset 0 0 18px rgba(255,255,255,0.2);}
  .bubble.pulse .face{animation:bp 2.6s ease-in-out infinite;}
  @keyframes bp{0%,100%{box-shadow:0 10px 26px rgba(0,0,0,0.3),0 0 0 0 rgba(169,206,59,0.35);}
    50%{box-shadow:0 10px 26px rgba(0,0,0,0.3),0 0 0 7px rgba(169,206,59,0);}}

  .bottom-bar{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:12px 20px 18px;text-align:center;
    background:linear-gradient(to top, rgba(6,64,60,0.92), rgba(6,64,60,0));}
  .bottom-hint{font-size:10.5px;opacity:.72;line-height:1.35;}

  #modal{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(4,40,37,0.72);backdrop-filter:blur(6px);}
  #modal.show{display:flex;animation:fade .25s;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card{width:87%;max-width:350px;background:linear-gradient(160deg,#0e6b62,#06403C);
    border:1px solid rgba(169,206,59,0.35);border-radius:20px;padding:24px 22px 22px;
    box-shadow:0 24px 60px rgba(0,0,0,0.5);transform:translateY(10px) scale(.96);animation:cardIn .35s cubic-bezier(.2,.9,.3,1.4) forwards;}
  @keyframes cardIn{to{transform:translateY(0) scale(1)}}
  .card .eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--lime);font-weight:800;text-transform:uppercase;}
  .card h2{font-size:18px;margin:3px 0 8px;}
  .card .clue{font-size:13px;opacity:.9;line-height:1.45;margin-bottom:16px;}
  .card input{width:100%;background:rgba(255,255,255,0.09);border:1.5px solid rgba(169,206,59,0.4);border-radius:12px;
    padding:14px 16px;color:#fff;font-size:17px;font-weight:800;letter-spacing:3px;text-align:center;text-transform:uppercase;outline:none;transition:border-color .2s;}
  .card input:focus{border-color:var(--lime);}
  .card input.shake{animation:shake .4s;border-color:#e06666;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .card .feedback{font-size:11px;height:15px;margin-top:8px;color:#f8a;}
  .btn-row{display:flex;gap:10px;margin-top:14px;}
  .btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:13px;font-weight:800;cursor:pointer;transition:transform .15s;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;}
  .btn-ghost{background:rgba(255,255,255,0.12);color:#fff;}
  .card .dotmini{width:30px;height:30px;border-radius:50%;margin-bottom:8px;
    background:radial-gradient(circle at 34% 30%,#a7d97a,var(--green-d) 60%,var(--green-dk));box-shadow:0 4px 14px rgba(91,155,52,0.5);}

  #burst{position:absolute;inset:0;z-index:25;pointer-events:none;}
  .spark{position:absolute;width:8px;height:8px;border-radius:50%;}
  #toast{position:absolute;z-index:28;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
    background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;padding:14px 24px;border-radius:16px;
    font-size:15px;font-weight:800;letter-spacing:.5px;opacity:0;pointer-events:none;box-shadow:0 12px 40px rgba(91,155,52,0.5);}
  #toast.show{animation:toastPop 1.6s ease forwards;}
  @keyframes toastPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
    30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}

  #victory{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px;background:radial-gradient(ellipse at center, rgba(10,90,84,0.97), rgba(6,64,60,0.99));backdrop-filter:blur(4px);}
  #victory.show{display:flex;animation:fade .5s;}
  #victory .vchev{width:70px;height:52px;margin-bottom:10px;}
  #victory .final-reveal{display:flex;gap:3px;margin:14px 0 18px;flex-wrap:nowrap;justify-content:center;}
  #victory .fr-letter{width:24px;height:32px;border-radius:6px;background:linear-gradient(135deg,var(--green),var(--green-d));
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:0 5px 16px rgba(91,155,52,0.45);opacity:0;flex:0 0 auto;}
  #victory h2{font-size:22px;}
  #victory p{font-size:13px;opacity:.85;margin-top:6px;max-width:290px;line-height:1.5;}
  #victory .gift{margin-top:20px;background:rgba(255,255,255,0.1);border:1px solid rgba(169,206,59,0.4);border-radius:14px;padding:12px 20px;font-size:12.5px;}
  #victory .gift b{color:var(--lime);}
  #victory .btn{margin-top:18px;max-width:200px;flex:0 0 auto;height:46px;}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;}}
</style>
</head>

const VARIANTS=["v-sky","v-royal","v-navy","v-cyan","v-lightblue","v-teal"];

let VERSION="CONNECTIVITY",CLUES=[],FINAL="",found=[],activeIndex=-1;
const app=document.getElementById('app');
const bubblesEl=document.getElementById('bubbles');
const finalWordEl=document.getElementById('finalWord');
const foundCountEl=document.getElementById('foundCount');
const APP_W=()=>app.clientWidth,APP_H=()=>app.clientHeight;
const TOP_SAFE=150,BOT_SAFE=58;
const B=[];

function setVersion(v){VERSION=v;
  document.getElementById('v12').classList.toggle('active',v==="CONNECTIVITY");
  document.getElementById('v13').classList.toggle('active',v==="CONSTELLATION");resetGame();}
function buildFinal(){FINAL=CLUES.map(c=>c.word[c.li].toUpperCase()).join('');}
function styledWord(c){const w=c.word;return w.slice(0,c.li)+'<b>'+w[c.li]+'</b>'+w.slice(c.li+1);}

function resetGame(){
  CLUES=VERSIONS[VERSION].map((c,i)=>({...c,variant:VARIANTS[i%VARIANTS.length]}));
  buildFinal();found=new Array(CLUES.length).fill(false);activeIndex=-1;
  foundCountEl.textContent=0;document.getElementById('totalCount').textContent=CLUES.length;
  document.getElementById('victory').classList.remove('show');document.getElementById('modal').classList.remove('show');
  finalWordEl.innerHTML='';
  FINAL.split('').forEach(ch=>{const s=document.createElement('div');s.className='fw-slot';s.textContent=ch;finalWordEl.appendChild(s);});
  initBubbles();
}
function initBubbles(){
  const w=APP_W(),h=APP_H();bubblesEl.innerHTML='';B.length=0;
  const n=CLUES.length;const base=n>12?70:74;
  CLUES.forEach((c,i)=>{
    const s=base+(i%3)*8;
    const el=document.createElement('div');
    el.className='bubble pulse '+c.variant;
    el.style.width=el.style.height=s+'px';
    el.innerHTML=`<div class="face"><div class="clue">${c.short}</div><div class="word"></div></div>`;
    el.addEventListener('click',()=>openModal(i));
    bubblesEl.appendChild(el);
    const r=s/2;
    const x=r+8+Math.random()*(w-2*r-16);
    const y=TOP_SAFE+r+Math.random()*(h-TOP_SAFE-BOT_SAFE-2*r);
    const ang=Math.random()*6.28,sp=0.30+Math.random()*0.20;
    B.push({el,r,m:r*r,x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,phase:Math.random()*6.28,squash:0});
  });
}

const canvas=document.getElementById('dotsCanvas'),ctx=canvas.getContext('2d');
function sizeCanvas(){const dpr=window.devicePixelRatio||1;
  canvas.width=app.clientWidth*dpr;canvas.height=app.clientHeight*dpr;
  canvas.style.width=app.clientWidth+'px';canvas.style.height=app.clientHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
const bg=[];
function initBg(){bg.length=0;for(let i=0;i<22;i++)bg.push({x:Math.random()*APP_W(),y:Math.random()*APP_H(),r:Math.random()*1.6+0.6,vx:(Math.random()*2-1)*0.12,vy:(Math.random()*2-1)*0.12});}

// Draw a brand chevron ">" centered at (cx,cy), rotated to angle, sized by scale, in given color
function drawChevron(cx,cy,angle,size,color){
  ctx.save();
  ctx.translate(cx,cy);ctx.rotate(angle);
  const L=size,th=size*0.34;           // arm length + thickness
  ctx.strokeStyle=color;ctx.lineWidth=th;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(-L*0.55,-L*0.7);
  ctx.lineTo(L*0.5,0);
  ctx.lineTo(-L*0.55,L*0.7);
  ctx.stroke();
  // dot at the vertex
  ctx.fillStyle='#1B4A6E';
  ctx.beginPath();ctx.arc(L*0.5,0,th*0.62,0,6.28);ctx.fill();
  ctx.restore();
}

let t=0;
function tick(){
  t+=0.016;const w=APP_W(),h=APP_H();
  for(const b of B){b.x+=b.vx;b.y+=b.vy;b.phase+=0.02;
    if(b.x<b.r+6){b.x=b.r+6;b.vx=Math.abs(b.vx);}if(b.x>w-b.r-6){b.x=w-b.r-6;b.vx=-Math.abs(b.vx);}
    if(b.y<TOP_SAFE+b.r){b.y=TOP_SAFE+b.r;b.vy=Math.abs(b.vy);}if(b.y>h-BOT_SAFE-b.r){b.y=h-BOT_SAFE-b.r;b.vy=-Math.abs(b.vy);}}
  for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){
    const a=B[i],c=B[j];let dx=c.x-a.x,dy=c.y-a.y,dist=Math.hypot(dx,dy);const min=a.r+c.r;
    if(dist>0&&dist<min){const nx=dx/dist,ny=dy/dist,overlap=min-dist;
      a.x-=nx*overlap/2;a.y-=ny*overlap/2;c.x+=nx*overlap/2;c.y+=ny*overlap/2;
      const rvx=c.vx-a.vx,rvy=c.vy-a.vy,vn=rvx*nx+rvy*ny;
      if(vn<0){const rest=0.9,imp=-(1+rest)*vn/(1/a.m+1/c.m),ix=imp*nx,iy=imp*ny;
        a.vx-=ix/a.m;a.vy-=iy/a.m;c.vx+=ix/c.m;c.vy+=iy/c.m;a.squash=0.92;c.squash=0.92;}}}
  for(const b of B){const sp=Math.hypot(b.vx,b.vy),max=0.8,mn=0.14;
    if(sp>max){b.vx=b.vx/sp*max;b.vy=b.vy/sp*max;}if(sp<mn&&sp>0){b.vx=b.vx/sp*mn;b.vy=b.vy/sp*mn;}
    const bob=Math.sin(b.phase)*3.5,sq=b.squash?b.squash:1;
    b.el.style.left=(b.x-b.r)+'px';b.el.style.top=(b.y-b.r+bob)+'px';
    b.el.style.transform=`scale(${sq.toFixed(3)})`;
    if(b.squash){b.squash+=(1-b.squash)*0.18;if(Math.abs(1-b.squash)<0.004)b.squash=0;}}
  for(const d of bg){d.x+=d.vx;d.y+=d.vy;if(d.x<0||d.x>w)d.vx*=-1;if(d.y<0||d.y>h)d.vy*=-1;}
  ctx.clearRect(0,0,w,h);
  // ambient faint constellation
  for(let i=0;i<bg.length;i++)for(let j=i+1;j<bg.length;j++){const dx=bg[i].x-bg[j].x,dy=bg[i].y-bg[j].y,d=Math.hypot(dx,dy);
    if(d<95){ctx.strokeStyle=`rgba(169,206,59,${(1-d/95)*0.1})`;ctx.lineWidth=0.6;ctx.beginPath();ctx.moveTo(bg[i].x,bg[i].y);ctx.lineTo(bg[j].x,bg[j].y);ctx.stroke();}}
  for(const d of bg){ctx.fillStyle='rgba(169,206,59,0.3)';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.28);ctx.fill();}
  // CONNECT found bubbles with chevrons ">" pointing along each link
  const chain=[];B.forEach((b,i)=>{if(found[i])chain.push(b);});
  if(chain.length>=2){for(let i=0;i<chain.length-1;i++){const a=chain[i],c=chain[i+1];
    const dx=c.x-a.x,dy=c.y-a.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);
    // faint guide line
    ctx.strokeStyle='rgba(169,206,59,0.35)';ctx.lineWidth=1.4;ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.stroke();ctx.setLineDash([]);
    // chevrons marching along the link (leave gaps near bubbles)
    const gap=a.r+8, gap2=c.r+8;
    const usable=dist-gap-gap2;
    if(usable>18){
      const step=26;const count=Math.max(1,Math.floor(usable/step));
      const chevSize=13;
      for(let k=1;k<=count;k++){
        const tt=(gap + usable*(k/(count+1)))/dist;
        const px=a.x+dx*tt, py=a.y+dy*tt;
        // travelling shimmer
        const pulse=(Math.sin(t*2 - i - k*0.4)*0.5+0.5);
        const col = pulse>0.6 ? '#A9CE3B' : '#8DBF5E';
        drawChevron(px,py,ang,chevSize,col);
      }
    }
  }}
  requestAnimationFrame(tick);
}

const modal=document.getElementById('modal'),mInput=document.getElementById('mInput'),mFeedback=document.getElementById('mFeedback');
function openModal(i){if(found[i]){flashToast("Already unlocked \u2713");return;}activeIndex=i;const c=CLUES[i];
  document.getElementById('mShort').textContent=c.short;document.getElementById('mClue').textContent=c.long;
  mInput.value='';mFeedback.textContent='';modal.classList.add('show');setTimeout(()=>mInput.focus(),120);}
function closeModal(){modal.classList.remove('show');activeIndex=-1;}
document.getElementById('mCancel').addEventListener('click',closeModal);
document.getElementById('mValidate').addEventListener('click',validate);
mInput.addEventListener('keydown',e=>{if(e.key==='Enter')validate();});
function norm(s){return s.trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z]/g,'');}
function validate(){if(activeIndex<0)return;const g=norm(mInput.value);if(!g)return;
  if(g===norm(CLUES[activeIndex].word)){markFound(activeIndex);closeModal();}
  else{mInput.classList.add('shake');mFeedback.textContent="Not quite \u2014 read the clue again \ud83d\udc40";setTimeout(()=>mInput.classList.remove('shake'),400);}}
function markFound(i){found[i]=true;const c=CLUES[i],b=B[i];b.el.classList.remove('pulse');b.el.classList.add('found');
  b.el.querySelector('.word').innerHTML=styledWord(c);
  const slot=finalWordEl.children[i];if(slot)slot.classList.add('filled','pop');
  sparkBurst(b.x,b.y);flashToast(c.word.toUpperCase()+" !");
  const cnt=found.filter(Boolean).length;foundCountEl.textContent=cnt;if(cnt===CLUES.length)setTimeout(showVictory,1400);}
const burst=document.getElementById('burst');
function sparkBurst(x,y){const cols=['#A9CE3B','#8DBF5E','#4EB8E0','#1B4A6E'];
  for(let i=0;i<18;i++){const s=document.createElement('div');s.className='spark';s.style.background=cols[i%cols.length];
    s.style.left=x+'px';s.style.top=y+'px';burst.appendChild(s);const a=(6.28/18)*i+Math.random()*0.4,dist=45+Math.random()*55;
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist}px) scale(0)`,opacity:0}],
      {duration:650+Math.random()*250,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>s.remove();}}
const toast=document.getElementById('toast');
function flashToast(m){toast.textContent=m;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show');}
function showVictory(){const v=document.getElementById('victory'),reveal=document.getElementById('finalReveal');reveal.innerHTML='';
  FINAL.split('').forEach(ch=>{const d=document.createElement('div');d.className='fr-letter';d.textContent=ch;reveal.appendChild(d);});
  v.classList.add('show');
  Array.from(reveal.children).forEach((el,i)=>setTimeout(()=>{
    el.animate([{opacity:0,transform:'scale(.3) rotateY(90deg)'},{opacity:1,transform:'scale(1) rotateY(0)'}],{duration:500,easing:'cubic-bezier(.2,.9,.3,1.4)',fill:'forwards'});
    sparkBurst(APP_W()/2,APP_H()/2-40);},i*110));}
function boot(){sizeCanvas();initBg();resetGame();tick();}
window.addEventListener('resize',()=>{sizeCanvas();initBg();initBubbles();});
boot();
</script>
</body>
</html>
